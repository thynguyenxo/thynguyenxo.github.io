name: Trigger monthly rebuild

# Cloudflare Pages builds on push, so this workflow does not deploy — it only
# pokes a deploy hook so the site rebuilds on a schedule.
#
# The copyright year is baked in at build time, so the site needs a rebuild to
# pick up a new one. Monthly rather than yearly for two reasons: GitHub
# disables cron on repositories with no activity for 60 days, which a
# once-a-year schedule would trip, and a missed or delayed run in January
# self-corrects in February instead of waiting a year.
on:
  schedule:
    - cron: '15 0 1 * *'
  workflow_dispatch:

permissions: {}

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Call Cloudflare Pages deploy hook
        env:
          # Create the hook in the Pages project (Settings → Builds &
          # deployments → Deploy hooks) and store the URL it gives you as the
          # CLOUDFLARE_DEPLOY_HOOK repository secret. The URL is a credential:
          # anyone holding it can trigger builds.
          DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "CLOUDFLARE_DEPLOY_HOOK is not set; nothing to trigger." >&2
            exit 1
          fi
          curl --fail --silent --show-error -X POST "$DEPLOY_HOOK"
